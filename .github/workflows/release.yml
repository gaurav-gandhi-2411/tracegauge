name: Release

# Tag-triggered publish to PyPI (Trusted Publishing / OIDC). The publish job REFUSES to run unless
# three preflight jobs pass, modelled on adk-tracegauge's and agentgauge's release.yml:
#
#   preflight-version   pyproject.toml, uv.lock and CHANGELOG.md's top release heading agree on the
#                       version; on a tag push the tag equals it; the version is not already on PyPI
#                       (scripts/check_release_version.py -- anything it cannot determine is a refusal)
#   preflight-build     the wheel and sdist this release would publish build, pass `twine check`, and
#                       a fresh non-editable install of the wheel reports that version; built twice on
#                       two separate runners, and `reproducible` refuses unless both builds have the
#                       same sha256 (scripts/build_dist.py, RELEASING.md)
#   verify-artifact     the dist/ each build uploaded (artifact dist-a, dist-b) matches the
#                       checked SHA256SUMS byte for byte (scripts/verify_dist.py)
#   gate-canary         the latest SCHEDULED pypi-canary run on master is green and recent
#
# The publish job does NOT rebuild: it downloads build a's dist-a artifact, re-verifies it against
# the same SHA256SUMS with the same script, and uploads exactly those files.
#
# `workflow_dispatch` runs the same preflights against the chosen ref and NEVER publishes (the
# publish job is `if: github.event_name == 'push'`): run it on master before tagging. Why: 0.12.3 to
# 0.13.0 were released importing fine on 3.11 and not at all on 3.10, 0.11.0 shipped with no README
# section, and the version lives in a place a hardcoded test assertion once went stale in. A check
# that reports changes nothing; a check that blocks does. There is no override input, deliberately.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Least privilege by default: a job that needs more (gate-canary: actions read; publish: OIDC)
# declares its own block, which replaces this one.
permissions:
  contents: read

jobs:
  preflight-version:
    name: Refuse to release when the tag and the version sources disagree
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      EVENT: ${{ github.event_name }}
      REF_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: pyproject, uv.lock, CHANGELOG, the tag, and PyPI
        run: |
          if [ "$EVENT" = "push" ]; then
            python scripts/check_release_version.py --pypi --tag "$REF_NAME"
          else
            python scripts/check_release_version.py --pypi
          fi

  preflight-build:
    name: Refuse to release artifacts that do not build, check or install (build ${{ matrix.build }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build: [a, b] # two independent builds of the same commit, compared by `reproducible`
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv --quiet

      - name: Build sdist + wheel
        run: python scripts/build_dist.py dist | tee SHA256SUMS.txt

      - name: Publish the artifact hashes
        run: |
          {
            echo "### Build ${{ matrix.build }}: $(git rev-parse HEAD)"
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: sha256-${{ matrix.build }}
          path: SHA256SUMS.txt
          if-no-files-found: error

      # The exact files hashed above: publish uploads these, it never rebuilds.
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.build }}
          path: dist/
          if-no-files-found: error

      - name: twine check
        run: uvx twine check dist/*.whl dist/*.tar.gz

      - name: A fresh, non-editable install of the wheel runs and reports the version
        run: |
          set -euo pipefail
          expected=$(python scripts/check_release_version.py | sed 's/^release version OK: //')
          python -m venv "$RUNNER_TEMP/verify"
          "$RUNNER_TEMP/verify/bin/pip" install --quiet dist/*.whl
          got=$("$RUNNER_TEMP/verify/bin/tracegauge" --version)
          echo "expected $expected; installed wheel says: $got"
          case "$got" in *"$expected"*) ;; *) echo "::error::the installed wheel reports '$got', not $expected"; exit 1;; esac

  reproducible:
    name: Refuse to release if two independent builds of this commit differ
    needs: [preflight-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sha256-*
      - name: The sdist and wheel sha256 of build a and build b are identical
        run: |
          set -euo pipefail
          cat sha256-a/SHA256SUMS.txt
          diff sha256-a/SHA256SUMS.txt sha256-b/SHA256SUMS.txt             || { echo "::error::two builds of the same commit produced different artifacts"; exit 1; }
          test "$(wc -l < sha256-a/SHA256SUMS.txt)" -eq 2
          echo "reproducible: both builds match"

  verify-artifact:
    # Runs on every event, including workflow_dispatch: the same download + verify the publish job
    # does, so a dispatch run proves the artifact publish would consume equals the checked hashes.
    name: Refuse to release if the uploaded dist differs from the checked hashes
    needs: [reproducible]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: sha256-*
          path: sums
      - uses: actions/download-artifact@v4
        with:
          name: dist-a
          path: dist-a
      - uses: actions/download-artifact@v4
        with:
          name: dist-b
          path: dist-b
      - name: Both uploaded dist directories equal the checked SHA256SUMS of both builds
        run: |
          set -euo pipefail
          python3 scripts/verify_dist.py dist-a sums/sha256-a/SHA256SUMS.txt sums/sha256-b/SHA256SUMS.txt
          python3 scripts/verify_dist.py dist-b sums/sha256-a/SHA256SUMS.txt sums/sha256-b/SHA256SUMS.txt
          test "$(ls dist-a | wc -l)" -eq 2
          test "$(ls dist-b | wc -l)" -eq 2
          echo "verify-artifact: dist-a and dist-b match the checked hashes"

  gate-canary:
    name: Refuse to release while the latest scheduled pypi-canary run is red or stale
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: The latest SCHEDULED canary run on master must be recent and green
        # Only `schedule` runs on `master` count: a manual dispatch can turn the latest run green
        # without anything being fixed. Cancelled/skipped runs carry no signal. The canary is daily
        # and GitHub starts scheduled runs late and sometimes drops one, so the window is 3 days.
        # No qualifying run inside the window is a refusal, not a pass.
        env:
          GH_TOKEN: ${{ github.token }}
          CANARY_EVENT: schedule
          CANARY_BRANCH: master
          CANARY_MAX_AGE_DAYS: "3"
        run: |
          set -euo pipefail
          runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow pypi-canary.yml --event "$CANARY_EVENT" --branch "$CANARY_BRANCH" --status completed --limit 20 --json conclusion,createdAt,url,event,headBranch)
          RUNS="$runs" python3 - <<'PY'
          import json, os, sys
          from datetime import datetime, timezone

          event, branch = os.environ["CANARY_EVENT"], os.environ["CANARY_BRANCH"]
          max_age = float(os.environ["CANARY_MAX_AGE_DAYS"])
          runs = [r for r in json.loads(os.environ["RUNS"]) if r["conclusion"] in ("success", "failure")]
          if not runs:
              print(f"::error::no completed pypi-canary run with event={event} on branch {branch}; it cannot vouch for this release")
              sys.exit(1)
          latest = max(runs, key=lambda r: r["createdAt"])
          age = (datetime.now(timezone.utc) - datetime.fromisoformat(latest["createdAt"].replace("Z", "+00:00"))).total_seconds() / 86400
          print(f"latest qualifying canary run: {latest} (age {age:.2f} days, limit {max_age:g})")
          if latest["conclusion"] != "success":
              print(f"::error::the latest {event} pypi-canary run on {branch} is '{latest['conclusion']}' ({latest['url']}); a manual green re-run does not clear it -- fix the cause and wait for the next scheduled run")
              sys.exit(1)
          if age > max_age:
              print(f"::error::the latest {event} pypi-canary run on {branch} is {age:.1f} days old (limit {max_age:g}); a scheduled run was missed")
              sys.exit(1)
          print("canary gate: OK")
          PY

  publish:
    # Only a tag push publishes. A workflow_dispatch run stops after the preflights above.
    if: github.event_name == 'push'
    needs: [preflight-version, preflight-build, reproducible, verify-artifact, gate-canary]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for PyPI Trusted Publishing (OIDC) -- no token/password used
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          # Explicit: build from the tag that triggered this workflow, never a
          # branch head. For a `push: tags:` event, github.ref IS the tag ref
          # (refs/tags/vX.Y.Z) -- stated explicitly here so this can't silently
          # drift to a branch checkout if the trigger config ever changes.
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # No rebuild: the files uploaded below are the ones the preflight built, hashed and compared.
      - uses: actions/download-artifact@v4
        with:
          pattern: sha256-*
          path: sums
      - uses: actions/download-artifact@v4
        with:
          name: dist-a
          path: dist

      - name: The downloaded dist equals the checked SHA256SUMS
        run: |
          set -euo pipefail
          python3 scripts/verify_dist.py dist sums/sha256-a/SHA256SUMS.txt sums/sha256-b/SHA256SUMS.txt
          test "$(ls dist | wc -l)" -eq 2

      - name: Install uv
        run: pip install uv --quiet

      - name: twine check
        run: uvx twine check dist/*.whl dist/*.tar.gz

      - name: Publish to PyPI (Trusted Publishing -- OIDC, no token)
        uses: pypa/gh-action-pypi-publish@release/v1
