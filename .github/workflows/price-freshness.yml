name: Price table freshness

# Fails when any non-retired entry in tracegauge/data/prices.json is older than
# tracegauge.cost.STALE_THRESHOLD_DAYS (90 days). Pure date arithmetic against the
# bundled JSON file -- no network calls, no paid API calls, zero cost. A red
# run here means an entry needs re-verifying against its own source_url (see
# the script's output for which one), not that anything in this repo is
# broken.
#
# Added 0.10.2 (S1 audit fix, adapted from adk-tracegauge's own
# price-freshness.yml): before this workflow existed, prices.json had zero
# CI staleness signal of any kind and went 67 days stale with nobody
# noticing -- this is exactly the gap that let the missing
# claude-opus-5/claude-sonnet-5 entries (S1's mainline finding) go
# undetected for as long as they did.
#
# Weekly cadence, not daily: the threshold is measured in months (90 days),
# so a week's detection lag is negligible against that window, and running
# daily would just add 7x the CI noise for zero earlier warning in practice.
#
# A second, independent step below fetches Anthropic's own
# published pricing page and compares it directly against every non-retired
# entry this table claims -- replaces an earlier cross-repo-comparison plan
# (never implemented), which would have compared this table against
# adk-tracegauge's SIBLING table instead of against the vendor. Two tables
# compared only to each other stay green even while both drift into
# staleness together -- the exact failure noted above (this table went 67
# days stale with zero CI signal). A vendor page fetch failure or
# structural change fails this step loudly, distinct from a genuine price
# mismatch -- see scripts/check_price_table_vs_vendor.py's own docstring.
#
# 2026-10-09: that step used to walk only OUR keys (via a hand-kept name map)
# and compare only input/output, so a model the page lists but the table lacks
# (claude-opus-5-5, claude-sonnet-5-5) and the cache-hit columns went
# unchecked. It now derives the model list from the page, compares cache
# columns and tiers, and fails closed on an unparseable page. The always-on
# companion guard is tests/test_transcript_models_priced.py (runs in ci.yml);
# the real-transcript scan is a pre-release step, see RELEASING.md.

on:
  schedule:
    - cron: "0 8 * * 1" # every Monday 08:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

# Least privilege: the job only checks out the repository and runs read-only checks.
permissions:
  contents: read

jobs:
  price-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check price table freshness
        run: uv run python scripts/check_price_freshness.py

      - name: Check price table against Anthropic's own published page
        run: uv run python scripts/check_price_table_vs_vendor.py

      # Advisory only (continue-on-error): LiteLLM's community price file (MIT, fetched at
      # runtime, never vendored) often lists a new Claude model before this table does. A
      # warning here means "go read the official page", never "copy LiteLLM into prices.json" --
      # the official page above is the only source of truth. A fetch failure is a visible
      # warning, not a pass.
      - name: Cross-check against LiteLLM (advisory, non-fatal)
        continue-on-error: true
        run: uv run python scripts/check_prices_vs_litellm.py --strict
