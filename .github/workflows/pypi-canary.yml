name: PyPI Canary

# Daily check that the PUBLISHED package (not the repo source) still installs and runs cleanly
# in an isolated environment. Deliberately does NOT `actions/checkout` the repo for the
# quickstart step below, so this workflow tests only what `pip install tracegauge` actually
# resolves right now, decoupled from any future change to this repo's own source.

on:
  schedule:
    - cron: "23 6 * * *" # ~daily, arbitrary time chosen to avoid the top-of-hour GH Actions rush
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "Force a failure to test the issue-opening path (does not touch PyPI)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install tracegauge from PyPI (clean environment, no local source)
        run: python -m pip install --no-cache-dir tracegauge

      - name: tracegauge --version
        run: tracegauge --version

      - name: tracegauge quickstart (deterministic, no API key, no network call)
        run: tracegauge quickstart

      - name: Simulate failure (workflow_dispatch only, for testing the issue-opening path)
        if: github.event.inputs.simulate_failure == 'true'
        run: |
          echo "Deliberately failing -- simulate_failure=true was passed to workflow_dispatch."
          exit 1

      - name: Find existing open canary-failure issue
        if: failure()
        id: existing
        run: |
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --label pypi-canary-failure \
            --state open --json number --jq '.[0].number // empty')
          echo "number=$number" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Open or update an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BODY="The PyPI canary failed: a clean \`pip install tracegauge\` + quickstart did not \
          complete successfully. This is the published-package check -- it does not depend on \
          repo source state.

          Run: $RUN_URL
          Triggered: ${{ github.event_name }}"
          if [ -n "${{ steps.existing.outputs.number }}" ]; then
            gh issue comment "${{ steps.existing.outputs.number }}" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh label create pypi-canary-failure --repo "$GITHUB_REPOSITORY" \
              --description "Opened automatically by the daily PyPI-install canary workflow" \
              --color D93F0B --force
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "PyPI canary failed: clean install/quickstart broken" \
              --label pypi-canary-failure \
              --body "$BODY"
          fi

      - name: Close stale canary-failure issue on recovery
        if: success() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --label pypi-canary-failure \
            --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" \
              --body "Canary passed on the next scheduled run -- closing. Re-opens automatically if it fails again."
            gh issue close "$number" --repo "$GITHUB_REPOSITORY"
          fi

# Re-saved when the repository was recreated (2026-10): GitHub registers a workflow only when a push changes its file.
