<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 679 363" width="679" height="363" role="img" aria-labelledby="t d">
<title id="t">tracegauge quickstart</title>
<desc id="d">Animated terminal recording of tracegauge quickstart on the bundled synthetic sample session: token economy reading (building, 0 of 10 own sessions) with a context line, one deterministic waste finding and the cost breakdown. About 8 seconds, plays once.</desc>
<style>
text{font-family:ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace;font-size:13px;white-space:pre;fill:#DCE3F5}
.cmd{fill:#FF7A9C}.hd{fill:#8E99B8}
@keyframes show{from{opacity:0}to{opacity:1}}
text{animation:show .01s linear backwards}
@media (prefers-reduced-motion:reduce){text{animation:none}}
</style>
<rect width="679" height="363" rx="8" fill="#0E1322"/>
<text class="cmd" x="20" y="34" style="animation-delay:0.30s">$ tracegauge quickstart</text>
<text class="ln" x="20" y="53" style="animation-delay:1.20s">tracegauge quickstart -- no local judge, no network call, no files of yours read.</text>
<text class="hd" x="20" y="72" style="animation-delay:1.60s">── TOKEN ECONOMY ───────────────────────────────────────────────────────────</text>
<text class="ln" x="20" y="91" style="animation-delay:2.00s">  Real tokens: 531,840</text>
<text class="ln" x="20" y="110" style="animation-delay:2.40s">  Verdict:     UNAVAILABLE</text>
<text class="hd" x="20" y="129" style="animation-delay:2.80s">── TRAJECTORY QUALITY ──────────────────────────────────────────────────────</text>
<text class="ln" x="20" y="148" style="animation-delay:3.20s">  Verdict:     UNAVAILABLE (no local judge configured)</text>
<text class="hd" x="20" y="167" style="animation-delay:3.60s">── DETERMINISTIC WASTE ─────────────────────────────────────────────────────</text>
<text class="ln" x="20" y="186" style="animation-delay:4.00s">  Events:  1 event(s)</text>
<text class="ln" x="20" y="205" style="animation-delay:4.40s">  [1] REPEATED-FAILED-RETRY — 2 retries, turns: 61→62, 64→65  ~$0.041</text>
<text class="hd" x="20" y="224" style="animation-delay:4.80s">── COST BREAKDOWN ──────────────────────────────────────────────────────────</text>
<text class="ln" x="20" y="243" style="animation-delay:5.20s">  Context re-send (cache reads)                       $1.89   51.3%</text>
<text class="ln" x="20" y="262" style="animation-delay:5.60s">  Context growth (cache writes)                       $0.33    8.8%</text>
<text class="ln" x="20" y="281" style="animation-delay:6.00s">  Output                                              $0.80   21.8%</text>
<text class="ln" x="20" y="300" style="animation-delay:6.40s">  Fresh input                                         $0.63   17.0%</text>
<text class="ln" x="20" y="319" style="animation-delay:6.80s">  Detected waste (redundant reads, retry loops)       $0.04    1.1%</text>
<text class="ln" x="20" y="338" style="animation-delay:7.20s">  Total (priced)                                      $3.69</text>
</svg>
